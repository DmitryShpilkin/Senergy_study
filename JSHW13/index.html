<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деструктуризация</title>
</head>

<body>
    <h1>Примеры деструктуризации в JavaScript</h1>
    <p>Откройте консоль разработчика (F12), чтобы увидеть результат.</p>

    <script>
        // Работа с массивами
        console.log("--- 1. Деструктуризация массива ---");

        // Создаем исходный массив из 5 чисел
        const numbers = [10, 20, 30, 40, 50];

        // Используем деструктуризацию:
        // - a получает первый элемент (10)
        // - b получает второй элемент (20)
        // - ...rest (rest-оператор) собирает все оставшиеся элементы в новый массив [30, 40, 50]
        const [a, b, ...rest] = numbers;

        console.log("Первое число (a):", a); // 10
        console.log("Второе число (b):", b); // 20
        console.log("Остальные числа (rest):", rest); // [30, 40, 50]

        // Работа с объектами
        console.log("\n--- 2. Деструктуризация объекта ---");

        // Создаем объект с данными пользователя
        const user = { name: "Bob", age: 30, city: "New York" };

        // Извлекаем свойства 'name' и 'age' из объекта user
        // и создаем переменные с такими же именами.
        const { name, age } = user;

        console.log("Имя пользователя:", name); // Bob
        console.log("Возраст пользователя:", age); // 30

        // Примечание: переменная 'city' здесь не создается.

        // Вложенные структуры
        console.log("\n--- 3. Деструктуризация вложенных объектов ---");

        // Создаем объект с вложенной структурой
        const userWithProfile = {
            profile: {
                name: "Charlie",
                email: "charlie@example.com"
            }
        };

        // Глубокая деструктуризация:
        // Мы сразу обращаемся к вложенному объекту 'profile'
        // и извлекаем из него свойство 'email'.
        const { profile: { email } } = userWithProfile;

        console.log("Email пользователя:", email); // charlie@example.com

        // Реализация функции с деструктуризацией аргумента
        // Функция принимает ОДИН аргумент, который сразу деструктуризируется.
        // В фигурных скобках внутри параметров мы указываем, какие свойства
        // нам нужны из объекта. Это избавляет от необходимости писать user.name внутри функции.
        function printUser({ name, age }) {
            // Внутри функции мы сразу работаем с переменными name и age.
            console.log(`Имя: ${name}, Возраст: ${age}`);
        }

        const users = { name: "Diana", age: 28, city: "Paris" };

        // Вызываем функцию, передавая объект целиком.
        printUser(users); // Выведет: Имя: Diana, Возраст: 28
    </script>
</body>

</html>
